<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>District Tala-Tala — Statistiques</title>
<meta name="theme-color" content="#021c9d">
<meta name="description" content="Rapports et statistiques du district de Tala-Tala, champ apostolique de Kinshasa-Centre 2">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://kpdyowuhxekajsbnormp.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main class="center" aria-busy="true">
    <div class="skeleton hero" style="width:min(26rem,90vw);margin-bottom:1rem;"></div>
    <div class="skeleton line" style="width:min(20rem,80vw);"></div>
    <div class="skeleton line short"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:1rem">Cette application nécessite JavaScript.</p></noscript>

<!-- Ordre de chargement (scripts différés, exécutés dans cet ordre). Dépendances :
     config.js      : TT_CONFIG (adresse et clé publique Supabase) — requis par api.js
     api.js         : liaison Supabase — aucune dépendance
     store.js       : IndexedDB (stockage local) — aucune dépendance
     stats.js       : calculs (TTStats) — aucune dépendance au chargement
     ui.js          : outils d'affichage TT — requis par data.js et app.js
     chart.js       : graphiques SVG (TTChart) — aucune dépendance au chargement
     pdf.js         : rendu PDF (TTPdf) ; pdf-lib est chargé à la demande par loader.js
     schedule.js    : règle des services divins (TTSchedule) — requis par app.js
     data.js        : file d'attente et synchronisation — requis par app.js
     app.js         : écrans (dépend de tout ce qui précède) -->
<script defer src="config.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/stats.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/chart.js"></script>
<script defer src="js/signature.js"></script>
<script defer src="js/pdf.js"></script>
<script defer src="js/schedule.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/app.js"></script>

<script src="js/loader.js"></script>
</body>
</html>
